<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dingel Hafizia App</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}header{padding:20px;background:#fff;border-bottom:1px solid #e7ebf2;position:sticky;top:0}main{max-width:1100px;margin:auto;padding:24px}.brand{font-weight:800;font-size:22px}.sub{color:#64748b;font-size:13px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.card{background:#fff;border:1px solid #e7ebf2;border-radius:16px;padding:18px;box-shadow:0 5px 20px rgba(20,30,50,.05)}.label{font-size:12px;color:#64748b}.value{font-size:25px;font-weight:800;margin-top:7px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#111827;color:#fff}button.secondary{background:#eef2f7;color:#172033}.section{margin-top:16px}input,select{padding:11px;border:1px solid #dce2ea;border-radius:10px;width:100%;box-sizing:border-box}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f4}.badge{font-size:11px;padding:4px 8px;border-radius:99px;background:#edf2f7}.income{color:#16834a}.expense{color:#c43d3d}@media(max-width:700px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class="brand">Dingel Hafizia App</div><div class="sub">Madrasa Management • Offline First</div></header><main><div class="grid"><div class="card"><div class="label">TOTAL INCOME</div><div class="value" id="income">₹0</div></div><div class="card"><div class="label">TOTAL EXPENSE</div><div class="value" id="expense">₹0</div></div><div class="card"><div class="label">BALANCE</div><div class="value" id="balance">₹0</div></div></div><div class="card"><h3>Income / Expense</h3><div class="form"><select id="type"><option>Income</option><option>Expense</option></select><input id="amount" type="number" min="0" step="0.01" placeholder="Amount"><input id="category" placeholder="Category"><input id="date" type="date"><input id="description" class="full" placeholder="Description"><button class="full" onclick="addTx()">＋ Save Transaction</button></div></div><div class="card section"><div class="actions"><button class="secondary" onclick="filterTx('all')">All</button><button class="secondary" onclick="filterTx('Income')">Income</button><button class="secondary" onclick="filterTx('Expense')">Expense</button><button onclick="downloadCSV()">Export CSV</button></div><div id="list" style="margin-top:12px"></div></div></main><script>const KEY='dh_transactions_v2';let tx=JSON.parse(localStorage.getItem(KEY)||'[]');let filter='all';const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});function save(){localStorage.setItem(KEY,JSON.stringify(tx))}function addTx(){const amount=Number($('amount').value);if(!amount){alert('Amount দিন');return}tx.unshift({id:Date.now(),type:$('type').value,amount,category:$('category').value.trim()||'Other',date:$('date').value,description:$('description').value.trim()});save();$('amount').value='';$('description').value='';render()}function del(id){tx=tx.filter(x=>x.id!==id);save();render()}function filterTx(v){filter=v;render()}function render(){const rows=filter==='all'?tx:tx.filter(x=>x.type===filter);const inc=tx.filter(x=>x.type==='Income').reduce((s,x)=>s+x.amount,0),exp=tx.filter(x=>x.type==='Expense').reduce((s,x)=>s+x.amount,0);$('income').textContent=money(inc);$('expense').textContent=money(exp);$('balance').textContent=money(inc-exp);$('list').innerHTML=rows.length?rows.map(x=>`<div class="row"><div><b>${x.category}</b><div class="label">${x.date} • ${x.description||'—'}</div></div><div><b class="${x.type==='Income'?'income':'expense'}">${x.type==='Income'?'+':'−'}${money(x.amount)}</b><button class="secondary" onclick="del(${x.id})" style="margin-left:6px;padding:6px 9px">Delete</button></div></div>`).join(''):'<div class="sub">No transactions yet.</div>'}function downloadCSV(){const h='Date,Type,Category,Description,Amount\n';const body=tx.map(x=>[x.date,x.type,x.category,x.description||'',x.amount].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h+body],{type:'text/csv'}));a.download='dingel-hafizia-transactions.csv';a.click();URL.revokeObjectURL(a.href)}render()</script></body></html>
