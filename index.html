<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#173b63"><title>Dingel Hafizia App</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"></head><body><section id="login" class="login-screen"><form id="loginForm" class="login-card"><h1>Dingel Hafizia</h1><p>Madrasah Management App</p><div class="field"><label>Username</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit">LOGIN</button></form></section><section id="app" class="layout hidden"><header class="mobile-header"><b>DINGEL HAFIZIA</b><button id="menuBtn" class="menu-btn" aria-label="Open menu" aria-expanded="false" onclick="toggleMenu()">⋮</button></header><div id="menuOverlay" class="menu-overlay" onclick="toggleMenu(false)"></div><aside id="sidebar" class="sidebar"><div class="brand">DINGEL HAFIZIA<br>MADRASAH</div><button class="nav-btn active" data-page="dashboard">Dashboard</button><button class="nav-btn" data-page="students">Students</button><button class="nav-btn" data-page="fees">Fees</button><button class="nav-btn" data-page="settings">Settings</button><button class="nav-btn logout" onclick="logout()">Logout</button></aside><main class="main"><section id="page-dashboard" class="page"><div class="page-head"><h1>Dashboard</h1></div><div class="dashboard-empty"></div></section><section id="page-students" class="page hidden"><div class="page-head"><h1>Students <small id="studentCount"></small></h1><button onclick="addStudent()">+ Add Student</button></div><div class="toolbar"><input id="studentSearch" placeholder="Search roll, name, father, phone"><select id="studentFilter"><option>All</option><option>Active</option><option>Deactive</option></select></div><div class="table-wrap"><table><thead><tr><th>Roll</th><th>Name</th><th>Father</th><th>Class</th><th>Category</th><th>Monthly</th><th>Status</th><th>Action</th></tr></thead><tbody id="studentRows"></tbody></table></div></section><section id="page-fees" class="page hidden"><div class="page-head"><h1>Fees</h1><button onclick="addPayment()">+ Add Payment</button></div><div class="toolbar"><label>Month <input id="feeMonth" type="month"></label><input id="feeSearch" placeholder="Search student"></div><div class="fee-summary"><div><b>Total Students</b><span id="feeTotalStudents">0</span></div><div><b>Total Monthly</b><span id="feeTotalMonthly">0.00</span></div><div><b>Total Paid</b><span id="feeTotalPaid">0.00</span></div><div><b>Total Due</b><span id="feeTotalDue">0.00</span></div></div><div class="table-wrap"><table><thead><tr><th>Roll</th><th>Student</th><th>Monthly</th><th>Paid</th><th>Due</th><th>Action</th></tr></thead><tbody id="feeRows"></tbody></table></div></section><section id="page-settings" class="page hidden"><div class="page-head"><h1>Settings</h1></div></section></main></section><dialog id="studentModal" class="modal"><div class="modal-body"><h2 id="studentModalTitle">Add Student</h2><form id="studentForm"><div class="form-grid"><div class="field"><label>Roll *</label><input name="studentRoll" id="studentRoll" required></div><div class="field"><label>Student Name *</label><input name="studentName" id="studentName" required></div><div class="field"><label>Father Name *</label><input name="fatherName" id="fatherName" required></div><div class="field"><label>Phone Number</label><input name="phone" id="phone" inputmode="tel"></div><div class="field full"><label>Address</label><input name="address" id="address"></div><div class="field"><label>Student Aadhaar</label><input name="studentAadhaar" id="studentAadhaar"></div><div class="field"><label>Father Aadhaar</label><input name="fatherAadhaar" id="fatherAadhaar"></div><div class="field"><label>Admission Fees</label><input name="admissionFees" id="admissionFees" type="number" min="0"></div><div class="field"><label>Monthly Fees</label><input name="monthlyFees" id="monthlyFees" type="number" min="0"></div><div class="field"><label>Admission Date</label><input name="admissionDate" id="admissionDate" type="date"></div><div class="field"><label>Category</label><select name="studentCategory" id="studentCategory"><option>Atim</option><option>Free</option><option>Paid</option></select></div><div class="field"><label>Class</label><select name="studentClass" id="studentClass"><option>Maktab</option><option>Hifz</option><option>Adna Alif</option><option>Adna Ba</option></select></div><div class="field"><label>Status</label><select name="studentStatus" id="studentStatus"><option>Active</option><option>Deactive</option></select></div></div><div class="modal-actions"><button type="button" onclick="$('#studentModal').close()">Cancel</button><button type="submit">Save Student</button></div></form></div></dialog><dialog id="detailsModal" class="modal"><div class="modal-body" id="details"></div><div class="modal-actions"><button onclick="$('#detailsModal').close()">Close</button></div></dialog><dialog id="paymentModal" class="modal"><div class="modal-body"><h2>Add Fee Payment</h2><form id="paymentForm"><div class="field"><label>Student</label><select id="paymentStudent" name="paymentStudent"></select></div><div class="form-grid"><div class="field"><label>Payment Month *</label><input id="paymentMonth" name="paymentMonth" type="month" required></div><div class="field"><label>Paid Amount *</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Payment Date *</label><input name="paymentDate" type="date" required></div><div class="field"><label>Note</label><input name="note"></div></div><div class="modal-actions"><button type="button" onclick="$('#paymentModal').close()">Cancel</button><button type="submit">Save Payment</button></div></form></div></dialog><dialog id="historyModal" class="modal"><div class="modal-body" id="history"></div><div class="modal-actions"><button onclick="$('#historyModal').close()">Close</button></div></dialog><script src="app.js"></script></body></html>
